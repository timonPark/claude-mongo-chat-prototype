name: claude-mongo-chat

services:
  mongodb:
    image: mongo:8.0
    container_name: claude-mongo-chat-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: qDVacHFxc3Tg4A3jH7in
      MONGO_INITDB_DATABASE: sampledb
    volumes:
      - claude-mongo-chat-mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username root --password qDVacHFxc3Tg4A3jH7in --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  claude-mongo-chat-mongodb-data:
